[project]
name = "youtube-archiver"
version = "1.2.0"
description = "Back-end API for YouTube Archiver"
authors = [{ name = "Brian Turek", email = "brian.turek@gmail.com" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.3",
    "janus>=2.0.0",
    "yt-dlp[default,deno]>=2026.8.19",
]

[project.scripts]
youtube_archiver_api = "youtube_archiver.cli:server_cli"
youtube_archiver_download = "youtube_archiver.cli:download_cli"

[tool.ruff]
line-length = 120

[tool.mypy]
files = "src"

warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = "yt_dlp.*"
ignore_missing_imports = true

[tool.uv.build-backend]
module-name = "youtube_archiver"
source-include = ["src/youtube_archiver/py.typed"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.4",
    "types-yt-dlp>=2026.8.19.20260823",
]
